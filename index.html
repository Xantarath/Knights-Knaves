<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Character Sheet</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         RESPONSIVE SHEET WRAPPER
         ===================================================== -->

    <div class="sheet-wrapper">


        <!-- =================================================
             CHARACTER SHEET
             ================================================= -->

        <div class="character-sheet">


            <!-- =============================================
                 CHARACTER SHEET BACKGROUND
                 ============================================= -->

            <img
                src="character-sheet.png"
                alt="Character Sheet"
            >


            <!-- =============================================
                 NAME
                 ============================================= -->

            <input
                type="text"
                id="name"
            >


            <!-- =============================================
                 PHYSIQUE
                 ============================================= -->

            <select id="physique">

                <option value="Massive">
                    Massive
                </option>

                <option value="Huge">
                    Huge
                </option>

                <option value="Bulky">
                    Bulky
                </option>

                <option value="Muscular">
                    Muscular
                </option>

                <option value="Athletic">
                    Athletic
                </option>

                <option
                    value="Average"
                    selected
                >
                    Average
                </option>

                <option value="Toned">
                    Toned
                </option>

                <option value="Lean">
                    Lean
                </option>

                <option value="Slender">
                    Slender
                </option>

                <option value="Small">
                    Small
                </option>

                <option value="Meek">
                    Meek
                </option>

            </select>


            <!-- =============================================
                 HEIGHT
                 ============================================= -->

            <select id="height">

                <option value="Tall">
                    Tall
                </option>

                <option
                    value="Average"
                    selected
                >
                    Average
                </option>

                <option value="Short">
                    Short
                </option>

            </select>


            <!-- =============================================
                 PHYSIQUE-BASED VALUES
                 ============================================= -->

            <input
                type="text"
                id="stealth"
                readonly
            >

            <input
                type="text"
                id="mobility"
                readonly
            >

            <input
                type="text"
                id="endurance"
                readonly
            >

            <input
                type="text"
                id="recovery"
                readonly
            >

            <input
                type="text"
                id="fatigue"
            >

            <input
                type="text"
                id="fortitude"
                readonly
            >


            <!-- =============================================
                 MIGHT / PADDING
                 ============================================= -->

            <input
                type="text"
                id="might"
                readonly
            >

            <input
                type="text"
                id="padding"
                readonly
            >


            <!-- =============================================
                 HEIGHT / GRAPPLING VALUES
                 ============================================= -->

            <input
                type="text"
                id="reach"
                readonly
            >

            <input
                type="text"
                id="grappling"
                readonly
            >


            <!-- =============================================
                 WEIGHT / MOVEMENT / PRIORITY
                 ============================================= -->

            <input
                type="text"
                id="weight"
            >

            <input
                type="text"
                id="weightBase"
                readonly
            >

            <input
                type="text"
                id="weightEIndicator"
                readonly
            >

            <input
                type="text"
                id="movement"
                readonly
            >

            <input
                type="text"
                id="priority"
            >


            <!-- =============================================
                 INJURY PENALTY INDICATORS
                 ============================================= -->

            <input
                type="text"
                id="mightPenalty"
                readonly
            >

            <input
                type="text"
                id="mobilityPenalty"
                readonly
            >

            <input
                type="text"
                id="priorityPenalty"
                readonly
            >


            <!-- =============================================
                 SKILLS
                 ============================================= -->

            <textarea id="skills"></textarea>


            <!-- =============================================
                 INJURY SYSTEM
                 ============================================= -->

            <div id="injuryField">


                <!-- =========================================
                     ACTIVE INJURY TOKENS
                     ========================================= -->

                <div id="injuryTokens"></div>


                <!-- =========================================
                     ADD INJURY
                     ========================================= -->

                <select id="injurySelect">


                    <option value="">
                        +
                    </option>


                    <!-- =====================================
                         GENERAL
                         ===================================== -->

                    <option value="bleeding">
                        Bleeding
                    </option>

                    <option value="bruise">
                        Bruise
                    </option>


                    <!-- =====================================
                         HEAD
                         ===================================== -->

                    <option value="head-injury">
                        Head Injury
                    </option>

                    <option value="head-wound">
                        Head Wound
                    </option>


                    <!-- =====================================
                         LEFT ARM
                         ===================================== -->

                    <option value="left-arm-injury">
                        Left Arm Injury
                    </option>

                    <option value="left-arm-wound">
                        Left Arm Wound
                    </option>


                    <!-- =====================================
                         LEG
                         ===================================== -->

                    <option value="leg-injury">
                        Leg Injury
                    </option>

                    <option value="leg-wound">
                        Leg Wound
                    </option>


                    <!-- =====================================
                         RIGHT ARM
                         ===================================== -->

                    <option value="right-arm-injury">
                        Right Arm Injury
                    </option>

                    <option value="right-arm-wound">
                        Right Arm Wound
                    </option>


                    <!-- =====================================
                         TORSO
                         ===================================== -->

                    <option value="torso-injury">
                        Torso Injury
                    </option>

                    <option value="torso-wound">
                        Torso Wound
                    </option>


                </select>


            </div>


        </div>
        <!-- END CHARACTER SHEET -->


    </div>
    <!-- END RESPONSIVE SHEET WRAPPER -->


    <!-- =====================================================
         CHARACTER SHEET JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>


</body>

</html>
